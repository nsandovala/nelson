<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>HEO Chat</title>
</head>
<body>
    <h1>HEO - Asistente Médico</h1>
    <form method="post">
        <textarea name="user_input" rows="4" cols="50" placeholder="Escribe tu consulta..."></textarea>
        <br/>
        <input type="submit" value="Enviar" />
    </form>
    {% if response %}
    <h2>Respuesta:</h2>
    <p>{{ response }}</p>
    {% endif %}
</body>
</html>
