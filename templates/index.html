<!doctype html>
<html lang="es">
<head>
    <meta charset="utf-8">
    <title>HEO</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <h1>Hola, soy HEO. ¿Cómo te sientes hoy?</h1>

        <input type="text" name="feeling" placeholder="Escribe aquí" required>

    {% if response %}
    <p>{{ response }}</p>
    {% endif %}
</body>
</html>
