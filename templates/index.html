<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>HEO - Asistente emocional</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <h1>Hola, soy HEO. ¿Cómo te sientes hoy?</h1>
    <form method="post">
        <input type="text" name="mood" placeholder="Escribe cómo te sientes" required>
        <button type="submit">Enviar</button>
    </form>
    {% if message %}
    <p>{{ message }}</p>
    {% endif %}
</body>
</html>
